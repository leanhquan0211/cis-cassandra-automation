---
# Default is TV1 only. Other owners must opt in after their approval workflow.
- name: Provision Cassandra platform on fresh lab VMs
  hosts: cassandra_nodes
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - ../policies/lab.yml
  roles:
    - role: platform
      tags: [platform, tv1]
  tasks:
    - name: Run auth role only when explicitly requested
      ansible.builtin.include_role:
        name: auth
        apply:
          tags: [auth, tv2]
      tags: [never, auth, tv2]
    - name: Run observability and TLS role only when explicitly requested
      ansible.builtin.include_role:
        name: observability_tls
        apply:
          tags: [observability_tls, tv4]
      tags: [never, observability_tls, tv4]
