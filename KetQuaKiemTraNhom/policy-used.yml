policy_version: '1.0'
profile: level1_cassandra_linux
approved_by: Doan Van Tai
approved_at: '2026-11-07T15:05:18.773571Z'
review_due: '2026-12-07'
platform:
  dedicated_user: cassandra
  dedicated_group: cassandra
  disallowed_users:
  - root
  clock_sync:
    enabled: true
    max_abs_offset_ms: 100
    service_names:
    - chrony
    - ntp
    - systemd-timesyncd
  supported_os_distros:
  - Ubuntu 22.04
  - Ubuntu 24.04
  - Ubuntu 26.04
  required_java_version: 1.8.0
  required_cassandra_major: '4.0'
auth:
  authenticator: PasswordAuthenticator
  authorizer: CassandraAuthorizer
  role_manager: CassandraRoleManager
  default_user_disabled: true
  approved_superusers:
  - lab_dba
access:
  closed_world_permissions: true
  allowed_node_networks:
  - 192.168.56.0/24
  disallowed_listen_addresses:
  - 0.0.0.0
  network_authorizer: CassandraNetworkAuthorizer
  datacenter_authorization_enabled: true
  approved_roles:
  - role: lab_dba
    is_superuser: true
    can_login: true
    member_of: []
    permissions: []
  - role: cassandra
    is_superuser: false
    can_login: false
    member_of: []
    permissions: []
  - role: app_writer
    is_superuser: false
    can_login: true
    member_of:
    - writer_role
    permissions: []
  - role: app_reader
    is_superuser: false
    can_login: true
    member_of:
    - reader_role
    permissions: []
  - role: writer_role
    is_superuser: false
    can_login: false
    member_of: []
    permissions:
    - permission: SELECT
      resource: data/table/cis_demo/items
    - permission: MODIFY
      resource: data/table/cis_demo/items
  - role: reader_role
    is_superuser: false
    can_login: false
    member_of: []
    permissions:
    - permission: SELECT
      resource: data/table/cis_demo/items
observability_tls:
  logging:
    root_level: INFO
    valid_levels:
    - INFO
    - DEBUG
    - WARN
    - ERROR
    config_file: /etc/cassandra/logback.xml
  audit:
    enabled: true
    logger: BinAuditLogger
    audit_logs_dir: /var/log/cassandra/audit
    roll_cycle: HOURLY
    block: true
    max_queue_weight: 268435456
    max_log_size: 536870912
    included_categories: AUTH,DCL,DDL
    included_keyspaces: ''
    excluded_keyspaces: system,system_schema,system_virtual_schema
  tls:
    internode_encryption: all
    internode_optional: false
    client_encryption_enabled: true
    client_encryption_optional: false
    min_tls_version: TLSv1.2
    require_client_auth: true
    keystore_path: /etc/cassandra/tls/node.keystore
    truststore_path: /etc/cassandra/tls/node.truststore
approval_scope:
- '3.3'
- '3.5'
- '3.8'
approval_ref: auth-fixture-approval.json; explicit user approval in this session;
  private lab only
